<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 2 (Kryvenko)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="security-section">
    <div class="security-section__container">
      
      <h1 class="security-section__title">We are information security.</h1>

      <div class="security-section__phone">
        <a href="tel:+12345678910" class="phone-link">
          <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
          <span class="phone-number">+38 (0532) 567-891</span>
        </a>
      </div>

      <div class="security-section__content">
        <div class="security-section__avatar-wrap">
          <img src="462bcc36-aec6-441b-b9cc-ced716c9401a.jpg" alt="Спеціаліст з інформаційної безпеки" class="security-section__avatar">
        </div>

        <div class="security-section__info">
          <h2 class="security-section__subtitle">LOCATION</h2>

          <address class="security-section__address">
            Some street 5,<br>
            Poltava, 36000, Ukraine
          </address>

          <div class="security-section__divider"></div>

          <p class="security-section__text">
            Sample text. Click to select the text box. Click again or double click to start editing the text.
          </p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
