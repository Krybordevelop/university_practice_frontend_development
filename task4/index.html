<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice 4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="quote-page">
    <section class="quote-card" aria-labelledby="quote-title">
      <div class="image-section">
        <img src="assets/img/side-image.jpeg" alt="Specialist ready to help with your request">
      </div>

      <div class="form-section">
        <div class="form-intro">
          <p class="eyebrow">GET STARTED TODAY</p>
          <h1 id="quote-title">Get a Quote Now</h1>
          <p class="subtitle">Get a Quote Immediately Upon Form Submission</p>
        </div>

        <form class="form-main" id="quote-form">
          <div class="form-row">
            <div class="field">
              <label for="first-name">First name</label>
              <input id="first-name" name="firstName" type="text" placeholder="Enter your first name" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="last-name">Last name</label>
              <input id="last-name" name="lastName" type="text" placeholder="Enter your last name" autocomplete="family-name" required>
            </div>
          </div>

          <div class="form-row">
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" placeholder="+1 (555) 000-0000" autocomplete="tel" required>
            </div>
          </div>

          <div class="field">
            <label for="details">Order details</label>
            <textarea id="details" name="details" placeholder="Tell us what you need..." rows="4" required></textarea>
          </div>

          <button class="submit-btn" type="submit">Send Request <span aria-hidden="true">→</span></button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
